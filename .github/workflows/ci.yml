name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Spec 16: lint, unit tests and assembleRelease on every push.
      - name: Lint, unit tests, release build
        run: ./gradlew lint test assembleRelease assembleDebug --continue
        env:
          # Optional: Play Console licensing key, so FindPal Pro purchases are signature-checked.
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}

      # Installable test build (debug-signed). Download it from the run's Artifacts section.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickfind-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
