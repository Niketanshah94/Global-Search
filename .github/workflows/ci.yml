name: CI

on:
  push:
  pull_request:
  # "Run workflow" button on the Actions tab, e.g. to build the Play bundle after adding secrets.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # True once the Play upload key secrets are added (docs/store/PLAY_CONSOLE.md).
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_STORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Spec 16: lint, unit tests and assembleRelease on every push.
      - name: Lint, unit tests, release build
        run: ./gradlew lint test assembleRelease assembleDebug --continue
        env:
          # Optional: Play Console licensing key, so FindPal Pro purchases are signature-checked.
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}

      # Installable test build (debug-signed). Download it from the run's Artifacts section.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickfind-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Signed app bundle for Google Play. Runs only when the upload key secrets exist.
      - name: Signed Play bundle (.aab)
        if: success() && env.HAS_UPLOAD_KEY == 'true'
        env:
          PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FINDPAL_VERSION_CODE: ${{ github.run_number }}
        run: |
          # The upload keystore is committed encrypted (app/signing/upload.jks.enc) with its own
          # store password, so only that one short secret is needed. PKCS12: key password = store
          # password, alias "findpal".
          PW="$(printf '%s' "$UPLOAD_STORE_PASSWORD" | tr -d '[:space:]')"
          echo "UPLOAD_STORE_PASSWORD length: ${#PW} (expected 24)"
          if ! printf '%s' "$PW" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
               -in app/signing/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass stdin; then
            echo "::error::Could not unlock the upload key: re-paste the UPLOAD_STORE_PASSWORD secret exactly (24 characters, from GITHUB-SECRETS.txt)."
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PW" -alias findpal > /dev/null
          FINDPAL_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" \
          FINDPAL_UPLOAD_STORE_PASSWORD="$PW" FINDPAL_UPLOAD_KEY_PASSWORD="$PW" FINDPAL_UPLOAD_KEY_ALIAS=findpal \
            ./gradlew :app:bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Play bundle
        if: success() && env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: findpal-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
